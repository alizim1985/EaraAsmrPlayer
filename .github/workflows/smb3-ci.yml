name: SMB3 Android CI
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ feature/nonroot-smb3 ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Unit tests
        run: ./gradlew --stacktrace testDebugUnitTest
      - name: Lint (upstream project currently has known baseline errors)
        continue-on-error: true
        run: ./gradlew --stacktrace lintDebug
      - name: Assemble
        run: ./gradlew --stacktrace assembleDebug
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -name '*.apk' -type f | head -n1)
          test -n "$APK"
          unzip -t "$APK" >/dev/null
          echo "APK=$APK" >> "$GITHUB_ENV"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: EaraAsmrPlayer-1.2.3-SMB3-nonroot-debug
          path: ${{ env.APK }}
          if-no-files-found: error

